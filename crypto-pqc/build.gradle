// :crypto-pqc — post-quantum key material and OpenPGP-PQC hybrid packet
// composition. Original Kotlin code (MIT), independent of the
// org.sufficientlysecure.keychain.pgp.Pgp*Operation classes: it calls
// extern/bouncycastle-pg (also MIT) directly for OpenPGP packet structure,
// and the crypto-pqc-native Rust crate (via JNI, see src/main/jniLibs) for
// the ML-KEM/ML-DSA primitives themselves.
plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    namespace 'com.keychain.crypto.pqc'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    // Prebuilt liboqs JNI bindings from ../crypto-pqc-native (see that
    // crate's build-android.sh); not built from this Gradle project.
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation project(':extern:bouncycastle-pg')

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
