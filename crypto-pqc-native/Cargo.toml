[package]
name = "crypto_pqc_native"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "JNI bindings exposing liboqs (ML-KEM/ML-DSA) to the :crypto-pqc Kotlin module. Original code, independent of OpenKeychain's GPL crypto-operation classes."

[lib]
# cdylib for loading as a JNI shared library from Kotlin/Android,
# lib (rlib) so it can also be unit-tested on the host.
crate-type = ["cdylib", "lib"]

[dependencies]
jni = "0.21"
oqs = { version = "0.11", default-features = false, features = ["kems", "sigs", "vendored"] }

[profile.release]
lto = true
strip = true
